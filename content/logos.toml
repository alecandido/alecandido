# Logo catalogue. Paths are relative to assets/; `dark` is optional and is
# served to readers using GitHub's dark themes. Heights are tuned so that the
# marks look the same size next to each other.

[logo.tii]
alt = "Technology Innovation Institute"
url = "https://www.tii.ae/quantum"
light = "logos/tii.svg"
dark = "logos/tii-dark.svg"
height = 60

